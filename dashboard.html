<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Dashboard</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="config.js"></script>
    
    <style>
        :root {
            --bg: #0f172a;
            --surface: rgba(30, 41, 59, 0.95);
            --text: #f8fafc;
            --muted: #94a3b8;
            --primary: #38bdf8;
            --primary-hover: #0ea5e9;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --card-bg: rgba(51, 65, 85, 0.5);
            --border: rgba(148, 163, 184, 0.2);
        }

        * { box-sizing: border-box; }
        
        body {
            font-family: 'IBM Plex Sans Thai', sans-serif;
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #020617 100%);
            color: var(--text);
            display: flex;
            flex-direction: column;
        }

        /* 🌟 แถบเมนูด้านบน */
        .navbar {
            background: rgba(15, 23, 42, 0.9);
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .nav-brand h2 { margin: 0; color: var(--primary); font-size: 1.4rem; }
        .nav-brand p { margin: 4px 0 0; color: var(--muted); font-size: 0.9rem; }

        .nav-user { display: flex; align-items: center; gap: 20px; }
        .user-info { text-align: right; }
        .user-info strong { display: block; color: #fff; }
        .user-info span { font-size: 0.85rem; color: var(--primary); font-weight: 600; }

        .btn-logout {
            background: var(--danger);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-family: inherit;
            transition: 0.2s;
        }
        .btn-logout:hover { background: var(--danger-hover); }

        /* 🌟 พื้นที่หลัก */
        .container {
            flex: 1;
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        /* 🌟 หน้าจอที่ 1: เมนูเลือกปุ่ม */
        #menu-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            margin-top: 40px;
        }

        .menu-title { text-align: center; margin-bottom: 20px; }
        
        .button-grid {
            display: flex;
            gap: 24px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .big-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            width: 280px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            display: none; /* ซ่อนไว้ก่อน รอเช็คสิทธิ์ */
        }

        .big-btn:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: 0 10px 30px rgba(56, 189, 248, 0.2);
        }

        .big-btn .icon { font-size: 3rem; margin-bottom: 16px; }
        .big-btn h3 { margin: 0 0 8px; color: white; font-size: 1.3rem; }
        .big-btn p { margin: 0; color: var(--muted); font-size: 0.9rem; }

        /* 🌟 หน้าจอที่ 2: หน้าแสดงตารางข้อมูล */
        #data-view {
            display: none; /* ซ่อนไว้ก่อน */
            background: var(--surface);
            border-radius: 16px;
            padding: 30px;
            border: 1px solid var(--border);
        }

        .data-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .btn-back {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--muted);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }
        .btn-back:hover { background: rgba(255,255,255,0.1); }

        /* 🌟 ตารางข้อมูล */
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 14px 16px; border-bottom: 1px solid var(--border); }
        th { color: var(--primary); font-weight: 600; background: rgba(0,0,0,0.2); }
        tr:hover td { background: rgba(255,255,255,0.05); }

        .access-denied { text-align: center; color: var(--danger); margin-top: 50px; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-brand">
            <h2>Data707 System</h2>
            <p>Control Panel</p>
        </div>
        <div class="nav-user">
            <div class="user-info">
                <strong id="display-name">Loading...</strong>
                <span id="display-role">ROLE</span>
            </div>
            <button class="btn-logout" onclick="logout()">🚪 ออกจากระบบ</button>
        </div>
    </nav>

    <div class="container">
        
        <div id="menu-view">
            <div class="menu-title">
                <h2>เลือกเมนูการจัดการ</h2>
                <p style="color: var(--muted);">เมนูจะแสดงตามสิทธิ์การเข้าถึงของคุณ</p>
            </div>
            
            <div class="button-grid">
                <div class="big-btn" id="btn-users" onclick="openDataView('users')">
                    <div class="icon">👥</div>
                    <h3>จัดการ User</h3>
                    <p>ดูรายชื่อและแก้ไขสถานะผู้ใช้งาน</p>
                </div>

                <div class="big-btn" id="btn-logs" onclick="openDataView('logs')">
                    <div class="icon">📊</div>
                    <h3>ดู System Logs</h3>
                    <p>ตรวจสอบประวัติการใช้งานระบบ</p>
                </div>
            </div>

            <div id="no-access-msg" class="access-denied" style="display: none;">
                <h3>🚫 คุณไม่มีสิทธิ์เข้าถึงเมนูใดๆ ในหน้านี้</h3>
                <p>กรุณาติดต่อผู้ดูแลระบบ</p>
            </div>
        </div>

        <div id="data-view">
            <div class="data-header">
                <div>
                    <h2 id="data-title" style="margin: 0; color: var(--primary);">Title</h2>
                    <p id="data-desc" style="margin: 4px 0 0; color: var(--muted);">Description</p>
                </div>
                <button class="btn-back" onclick="goBackToMenu()">⬅️ กลับหน้าเลือกเมนู</button>
            </div>

            <div class="table-responsive">
                <table>
                    <thead id="tableHeader">
                        <tr></tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. เช็คสิทธิ์และล้วงกระเป๋า
            const userName = localStorage.getItem('u_name');
            const userDept = localStorage.getItem('u_dept');

            if (!userName || !userDept) {
                alert("⚠️ กรุณาเข้าสู่ระบบก่อน");
                window.location.href = 'index.html';
                return;
            }

            // 2. แสดงชื่อมุมขวาบน
            document.getElementById('display-name').innerText = userName;
            const dept = userDept.toLowerCase();
            document.getElementById('display-role').innerText = dept.toUpperCase();

            // 3. ระบบคัดกรองปุ่ม (RBAC)
            const btnUsers = document.getElementById('btn-users');
            const btnLogs = document.getElementById('btn-logs');
            const noAccessMsg = document.getElementById('no-access-msg');

            if (dept === 'admin') {
                btnUsers.style.display = 'block';
                btnLogs.style.display = 'block';
            } 
            else if (dept === 'hr') {
                btnUsers.style.display = 'block';
                // HR ไม่เห็นปุ่ม Logs
            } 
            else {
                // ถ้าเป็น User ธรรมดา ไม่ให้เห็นปุ่มไหนเลย
                noAccessMsg.style.display = 'block';
            }
        });

        // 🌟 ฟังก์ชัน: เมื่อกดปุ่มเมนู ให้สลับหน้าจอไปโชว์ตาราง
        function openDataView(type) {
            // ซ่อนหน้าเมนู โชว์หน้าตาราง
            document.getElementById('menu-view').style.display = 'none';
            document.getElementById('data-view').style.display = 'block';

            const title = document.getElementById('data-title');
            const desc = document.getElementById('data-desc');

            if (type === 'users') {
                title.innerText = '👥 ระบบจัดการ User';
                desc.innerText = 'รายชื่อผู้ใช้งานทั้งหมดในระบบ';
                loadUsers();
            } else if (type === 'logs') {
                title.innerText = '📊 System Logs Activity';
                desc.innerText = 'ประวัติการเข้าใช้งานและเหตุการณ์ในระบบ';
                loadLogs();
            }
        }

        // 🌟 ฟังก์ชัน: ปุ่มย้อนกลับมาหน้าเมนู
        function goBackToMenu() {
            document.getElementById('data-view').style.display = 'none';
            document.getElementById('menu-view').style.display = 'flex';
        }

        // 🌟 ฟังก์ชันสร้างหัวตาราง
        function setTableHeaders(columns) {
            const header = document.getElementById('tableHeader');
            const tr = document.createElement('tr');
            columns.forEach(col => {
                const th = document.createElement('th');
                th.innerText = col;
                tr.appendChild(th);
            });
            header.innerHTML = '';
            header.appendChild(tr);
        }

        // 🌟 ฟังก์ชันโหลดข้อมูล Users (ยิง API)
        function loadUsers() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">⏳ กำลังโหลดข้อมูล...</td></tr>';
            setTableHeaders(['USER_ID', 'USERNAME', 'ROLE', 'STATUS', 'จัดการสิทธิ์']);

            axios.get(`${CONFIG.API_URL}/all-users`)
                .then(res => {
                    const data = res.data; 
                    tbody.innerHTML = ''; 
                    data.forEach(row => {
                        const tr = document.createElement('tr');
                        const statusColor = row.STATUS === 'ACTIVE' ? '#4ade80' : '#f87171';
                        
                        const actionHtml = `
                            <select onchange="changeUserStatus('${row.USER_ID}', this.value)" style="padding: 6px; border-radius: 6px; background: rgba(15,23,42,0.9); color: white; border: 1px solid var(--primary); cursor: pointer;">
                                <option value="ACTIVE" ${row.STATUS === 'ACTIVE' ? 'selected' : ''}>ACTIVE</option>
                                <option value="DEACTIVATED" ${row.STATUS === 'DEACTIVATED' ? 'selected' : ''}>DEACTIVATED</option>
                            </select>
                        `;

                        tr.innerHTML = `
                            <td>${row.USER_ID || '-'}</td>
                            <td>${row.USERNAME || '-'}</td>
                            <td>${row.DEPARTMENT || '-'}</td>
                            <td style="color: ${statusColor}; font-weight: bold;">${row.STATUS || 'ACTIVE'}</td>
                            <td>${actionHtml}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                })
                .catch(err => {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--danger);">❌ ไม่สามารถเชื่อมต่อกับ API ได้</td></tr>`;
                });
        }

        // 🌟 ฟังก์ชันโหลดข้อมูล Logs (ยิง API)
        function loadLogs() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">⏳ กำลังโหลดข้อมูล...</td></tr>';
            setTableHeaders(['ลำดับ', 'USER_ID', 'USERNAME', 'ACTION', 'CLIENT_IP', 'STATUS', 'LOG_TIME']);

            axios.get(`${CONFIG.API_URL}/all-logs`)
                .then(res => {
                    const data = res.data; 
                    tbody.innerHTML = ''; 
                    
                    if(data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="7" style="text-align: center;">ไม่มีประวัติการใช้งาน</td></tr>';
                        return;
                    }

                    data.forEach((row, index) => {
                        let statusBadge = row.STATUS === 'SUCCESS' ? `<span style="color: #4ade80;">${row.STATUS}</span>` : `<span style="color: #f87171;">${row.STATUS}</span>`;

                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${index + 1}</td>
                            <td>${row.USER_ID || '-'}</td>
                            <td>${row.USERNAME || '-'}</td>
                            <td>${row.ACTION || '-'}</td>
                            <td>${row.CLIENT_IP || '-'}</td>
                            <td><b>${statusBadge}</b></td>
                            <td>${row.LOG_TIME || '-'}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                })
                .catch(err => {
                    tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--danger);">❌ ไม่สามารถเชื่อมต่อกับ API ได้</td></tr>`;
                });
        }

        // 🌟 ฟังก์ชันเปลี่ยนสถานะ User
        async function changeUserStatus(userId, newStatus) {
            const userDept = localStorage.getItem('u_dept');
            if (!confirm(`ยืนยันการเปลี่ยนสถานะของไอดี ${userId} เป็น ${newStatus} ใช่หรือไม่?`)) {
                loadUsers(); 
                return;
            }
            try {
                await axios.put(`${CONFIG.API_URL}/update-status/${userId}`, { status: newStatus, dept: userDept });
                alert('อัปเดตสถานะเสร็จสมบูรณ์!');
                loadUsers(); 
            } catch (error) {
                alert('เกิดข้อผิดพลาด คุณอาจไม่มีสิทธิ์');
                loadUsers();
            }
        }

        // 🌟 ฟังก์ชันออกจากระบบ
        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
